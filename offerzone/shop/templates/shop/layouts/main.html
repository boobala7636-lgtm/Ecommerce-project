{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts: Roboto & Poppins for E-commerce Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/6d1af18e06.js" crossorigin="anonymous"></script>

    <!-- Global E-commerce Base Styling -->
    <style>
      :root {
        --oz-blue: #2874f0;
        --oz-blue-dark: #1e52b6;
        --oz-orange: #fb641b;
        --oz-yellow: #ff9f00;
        --oz-green: #388e3c;
        --oz-bg: #f1f3f6;
        --oz-text-dark: #212121;
        --oz-text-sub: #878787;
      }

      /* Hide scrollbar for Chrome, Safari, Opera, Firefox, IE & Edge */
      html, body {
        background-color: var(--oz-bg);
        font-family: 'Poppins', Roboto, Arial, sans-serif;
        color: var(--oz-text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden; /* Prevents unwanted horizontal scrollbar */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0 !important;
        height: 0 !important;
      }

      main {
        flex: 1 0 auto;
      }

      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    </style>

    <!-- Project Static CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block title %}
    {% endblock title %}
  </head>
  <body>

    <!-- Header Navigation -->
    {% include 'shop/inc/navbar.html' %}

    <!-- Main Page Content -->
    <main>
      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer Section -->
    {% include 'shop/inc/footer.html' %}

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
